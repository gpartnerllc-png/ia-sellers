<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>IA SELLERS - Monitor de Ofertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans">
    <div class="container mx-auto p-6">
        <header class="flex justify-between items-center mb-10 border-b border-slate-700 pb-5">
            <h1 class="text-3xl font-bold text-cyan-400"><i class="fas fa-robot mr-3"></i>Buscador Inteligente IA</h1>
            <div id="status" class="bg-green-500 text-xs px-3 py-1 rounded-full animate-pulse">LIVE: MONITORANDO 18+ LOJAS</div>
        </header>

        <section class="bg-slate-800 p-6 rounded-xl shadow-2xl mb-10 border border-slate-700">
            <h2 class="text-xl mb-4 text-cyan-200">Cadastrar Novo Alerta de Preço</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input type="text" id="produto" placeholder="Produto (Ex: Arroz, iPhone, Pneu)" class="bg-slate-700 p-3 rounded border border-slate-600 focus:outline-none focus:border-cyan-400">
                <input type="number" id="preco_alvo" placeholder="Preço Máximo (R$)" class="bg-slate-700 p-3 rounded border border-slate-600 focus:outline-none focus:border-cyan-400">
                <button onclick="ativarIA()" class="bg-cyan-600 hover:bg-cyan-500 transition p-3 rounded font-bold uppercase tracking-wider shadow-[0_0_15px_rgba(8,145,178,0.5)]">Ativar IA de Busca</button>
            </div>
        </section>

        <h2 class="text-2xl mb-6 font-semibold"><i class="fas fa-bolt text-yellow-400 mr-2"></i>Ofertas Encontradas Agora</h2>
        <div id="feed-ofertas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="animate-pulse bg-slate-800 h-40 rounded-xl border border-slate-700"></div>
            <div class="animate-pulse bg-slate-800 h-40 rounded-xl border border-slate-700"></div>
            <div class="animate-pulse bg-slate-800 h-40 rounded-xl border border-slate-700"></div>
        </div>
    </div>

    <script>
        // Função Principal e Poderosa de Integração (Motor IA)
        async function ativarIA() {
            const produtoInput = document.getElementById('produto').value;
            const feed = document.getElementById('feed-ofertas');
            
            // Trava de segurança: impede busca vazia
            if(!produtoInput) {
                alert("Por favor, digite o nome de um produto para a IA buscar.");
                document.getElementById('produto').focus();
                return;
            }

            // 1. Estado de Carregamento Inteligente (Avisa o usuário que o Cloudflare está trabalhando)
            feed.innerHTML = `
                <div class="col-span-1 md:col-span-2 lg:col-span-3 text-center py-12 bg-slate-800 rounded-xl border border-cyan-900 shadow-inner">
                    <p class="text-cyan-400 font-bold text-xl animate-pulse"><i class="fas fa-radar fa-spin mr-3"></i> IA VARRENDO ATACADISTAS...</p>
                    <p class="text-slate-400 text-sm mt-3">Inspecionando Carrefour, Assaí, Atacadão, Tatico e Pão de Açúcar em tempo real.</p>
                </div>
            `;
            
            try {
                // 2. Conexão direta com o seu Cérebro no Cloudflare
                // EncodeURIComponent garante que produtos com espaço (ex: "Arroz 5kg") não quebrem o link
                const urlDoRobo = `https://ia-sellers.gpartnerllc.workers.dev/?produto=${encodeURIComponent(produtoInput)}`;
                
                const resposta = await fetch(urlDoRobo);
                
                if (!resposta.ok) {
                    throw new Error("Falha na comunicação com o servidor IA.");
                }

                const dados = await resposta.json();
                
                // 3. Limpa o aviso de carregamento para inserir a oferta
                feed.innerHTML = "";
                
                // 4. Se a IA retornar erro do lado do servidor
                if (dados.erro) {
                    feed.innerHTML = `<div class="col-span-3 p-4 bg-red-900/30 border border-red-500 rounded text-red-300"><i class="fas fa-exclamation-circle mr-2"></i> ${dados.erro}</div>`;
                    return;
                }

                // 5. Aciona a sua função visual para desenhar o Card
                adicionarOferta(
                    dados.loja || "Busca Concluída", 
                    dados.nome || produtoInput, 
                    dados.preco || "N/A", 
                    dados.link || "#"
                );
                
            } catch (erro) {
                // Tratamento de queda de servidor ou erro de rede
                feed.innerHTML = `
                    <div class="col-span-1 md:col-span-2 lg:col-span-3 bg-red-900/20 p-6 border border-red-600 rounded-xl text-center">
                        <p class="text-red-400 font-bold text-lg"><i class="fas fa-wifi mr-2"></i> Erro de Conexão com a IA Viva</p>
                        <p class="text-slate-400 mt-2 text-sm">Verifique se o seu Worker no Cloudflare está implantado corretamente.</p>
                        <p class="text-slate-500 mt-1 text-xs font-mono">${erro.message}</p>
                    </div>
                `;
            }
        }

        // Função Visual (Mantida 100% igual ao seu original, mas aprimorada com valores padrão)
        function adicionarOferta(loja, produto, preco, link) {
            const feed = document.getElementById('feed-ofertas');
            
            // Card com o seu design exato
            const card = `
                <div class="bg-slate-800 p-5 rounded-xl border-l-4 border-cyan-400 shadow-[0_4px_20px_rgba(0,0,0,0.5)] hover:scale-[1.02] transition-transform duration-300">
                    <div class="flex justify-between items-start">
                        <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider">${loja}</span>
                        <span class="text-green-400 font-bold bg-green-900/30 px-2 py-1 rounded text-lg">R$ ${preco}</span>
                    </div>
                    <h3 class="text-lg mt-3 font-medium text-white leading-tight">${produto}</h3>
                    
                    <div class="mt-5 flex items-center justify-between">
                        <a href="${link}" target="_blank" class="inline-block text-sm text-slate-300 hover:text-cyan-300 transition-colors font-semibold">
                            <i class="fas fa-shopping-cart mr-1"></i> Ir para Loja
                        </a>
                        <span class="text-[10px] text-slate-500 uppercase">Validado por IA</span>
                    </div>
                </div>
            `;
            
            // Adiciona a nova oferta sempre no topo da lista
            feed.insertAdjacentHTML('afterbegin', card);
        }
    </script>
</body>
</html>

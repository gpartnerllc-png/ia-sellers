<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado IA | SaaS B2B</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="https://mail.google.com/favicon.ico" type="image/x-icon" />
    <script>
        tailwind.config = { theme: { extend: { colors: { darkBg: '#050505', glassBg: 'rgba(20, 20, 20, 0.7)' } } } }
    </script>
    <style>
        body { 
            color: #ededed; 
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(5, 5, 5, 0.50), rgba(5, 5, 5, 0.75)), url('https://images.unsplash.com/photo-1587293852726-70cdb56c2866?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        input, textarea, select, button {
            -webkit-user-select: auto;
            -moz-user-select: auto;
            -ms-user-select: auto;
            user-select: auto;
        }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden flex flex-col items-center">

    <div class="absolute top-[-10%] left-[20%] w-[600px] h-[600px] bg-cyan-900/40 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <div id="tela-login" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-md transition-opacity duration-500">
        <div class="glass-panel bg-black/60 p-10 rounded-2xl w-full max-w-md shadow-[0_0_40px_rgba(8,145,178,0.2)] border-cyan-500/30">
            <div class="text-center mb-8">
                <i class="fas fa-fingerprint text-5xl text-cyan-400 mb-4"></i>
                <h2 class="text-3xl font-bold text-white">Acesso Operacional</h2>
                <p class="text-gray-400 text-sm mt-2">Identifique a sua loja para operar o sistema.</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="login-usuario" placeholder="ID da Loja (ex: admin, atacadao01)" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white outline-none focus:border-cyan-500 transition">
                <input type="password" id="login-senha" placeholder="Senha de Acesso" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white outline-none focus:border-cyan-500 transition">
                <button onclick="fazerLogin()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 rounded-xl transition-all uppercase tracking-widest mt-4">
                    Entrar no Sistema
                </button>
            </div>
        </div>
    </div>

    <div id="app-principal" class="w-full flex-col items-center pt-16 hidden">
        
        <button onclick="fazerLogout()" class="fixed top-6 left-6 z-50 glass-panel p-3 px-5 rounded-full text-gray-400 hover:text-red-400 hover:bg-red-900/20 transition-all text-sm font-bold flex items-center gap-2">
            <i class="fas fa-sign-out-alt"></i> Sair da <span id="nome-loja-header">Loja</span>
        </button>

        <button onclick="toggleCarrinho()" class="fixed top-6 right-6 z-50 glass-panel p-4 rounded-full text-cyan-400 hover:text-white hover:bg-cyan-600/30 transition-all shadow-[0_0_15px_rgba(8,145,178,0.4)]">
            <i class="fas fa-shopping-bag text-xl relative">
                <span id="contador-sacola" class="absolute -top-3 -right-4 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden">0</span>
            </i>
        </button>

        <div class="w-full max-w-6xl px-6 relative z-10 mx-auto">
            <header class="text-center mb-16">
                <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full glass-panel text-xs text-cyan-400 font-mono mb-6 uppercase tracking-widest border-cyan-500/30 bg-black/40">
                    <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Terminal Operacional: <span id="display-nome-loja" class="text-white font-bold ml-1">Carregando...</span>
                </div>
                <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-4 text-white drop-shadow-lg">Ofertas e Cotação</h1>
                <p class="text-gray-300 text-lg max-w-2xl mx-auto font-light">
                    Montamos sua Sexta Básica e Enviamos os Pedidos Direto para sua Casa.
                </p>
            </header>

            <div class="glass-panel p-2 rounded-2xl flex items-center shadow-2xl max-w-3xl mx-auto mb-16 relative hover:border-cyan-500/50 transition-colors duration-300 bg-black/60">
                <i class="fas fa-search text-gray-400 ml-4 text-xl"></i>
                <input type="text" id="produto" placeholder="Ex: Feijão Carioca 1kg" class="w-full bg-transparent border-none outline-none text-white px-4 py-4 text-lg placeholder-gray-500 focus:ring-0">
                <button onclick="ativarIA()" id="btn-buscar" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-[0_0_15px_rgba(8,145,178,0.5)] min-w-[140px]">
                    Buscar
                </button>
            </div>

            <div id="status-container" class="text-center mb-8 hidden"></div>
            <div id="feed-ofertas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20"></div>
        </div>
    </div>

    <div id="painel-carrinho" class="fixed top-0 right-0 w-full md:w-[450px] h-full glass-panel bg-[#050505]/95 z-50 transform translate-x-full transition-transform duration-300 flex flex-col border-l border-white/10">
        <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/50">
            <h2 class="text-xl font-bold text-white"><i class="fas fa-shopping-bag mr-2 text-cyan-400"></i> Sua Sacola</h2>
            <button onclick="toggleCarrinho()" class="text-gray-400 hover:text-white transition"><i class="fas fa-times text-2xl"></i></button>
        </div>
        <div id="itens-carrinho" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar"></div>
        
        <div class="p-6 border-t border-white/10 bg-black/80">
            <div class="flex justify-between items-center mb-6">
                <span class="text-gray-400 uppercase tracking-widest text-sm">Total do Pedido</span>
                <span id="total-carrinho" class="text-3xl font-bold text-cyan-400">R$ 0,00</span>
            </div>
            
            <div class="space-y-3 mb-6" id="form-checkout" style="display: none;">
                <input type="text" id="cliente-nome" placeholder="Nome Completo do Cliente" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition">
                <input type="text" id="cliente-telefone" placeholder="Telefone / WhatsApp" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition">
                
                <div class="flex gap-2">
                    <input type="text" id="cliente-cep" placeholder="CEP" class="w-1/3 bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition">
                    <input type="text" id="cliente-rua" placeholder="Rua / Avenida" class="w-2/3 bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition">
                </div>
                
                <div class="flex gap-2">
                    <input type="text" id="cliente-numero" placeholder="Número" class="w-1/3 bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition">
                    <input type="text" id="cliente-bairro" placeholder="Bairro / Complemento" class="w-2/3 bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition">
                </div>

                <select id="cliente-pagamento" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition appearance-none">
                    <option value="" disabled selected class="text-gray-400">Forma de Pagamento</option>
                    <option value="Pix" class="text-gray-900">Pagamento via Pix</option>
                    <option value="Dinheiro" class="text-gray-900">Dinheiro na Entrega</option>
                </select>
            </div>

            <button id="btn-finalizar" onclick="iniciarCheckout()" disabled class="w-full bg-gray-600 text-gray-300 font-bold py-4 rounded-xl transition-all uppercase tracking-widest cursor-not-allowed flex justify-center items-center gap-2">
                Adicione itens para comprar
            </button>
        </div>
    </div>

    <script>
        // ==============================================================
        // 1. BANCO DE DADOS DE LOJAS (ARQUITETURA MULTI-TENANT)
        // Aqui você cadastra os seus clientes. Cada um tem seu próprio Telegram.
        // ==============================================================
        const clientesSaaS = {
            "admin": { 
                senha: "323619", 
                nomeExibicao: "Central Mestre", 
                botToken: "8671565303:AAHA8RQZTmrdejIR0lpW4wFqDOhmnX88k9k", 
                chatId: "1703808186" 
            },
            "atacadao01": { 
                senha: "senhaatacadao", 
                nomeExibicao: "Atacadão - Filial Centro", 
                botToken: "TOKEN_DO_BOT_DO_ATACADAO_AQUI", // Exemplo de outro bot
                chatId: "CHAT_ID_DO_GERENTE_DO_ATACADAO" 
            },
            "tatico_sul": { 
                senha: "senhatatico", 
                nomeExibicao: "Tatico - Unidade Sul", 
                botToken: "TOKEN_DO_BOT_DO_TATICO_AQUI", 
                chatId: "CHAT_ID_DO_TATICO" 
            }
            // Pode adicionar quantas lojas quiser aqui!
        };

        // ==============================================================
        // 2. SISTEMA DE LOGIN E SESSÃO
        // ==============================================================
        let dadosLojaAtual = null;

        // Verifica se o usuário já fez login antes ao carregar a página
        window.onload = function() {
            const sessao = localStorage.getItem("mercadoIA_sessao");
            if (sessao) {
                dadosLojaAtual = JSON.parse(sessao);
                liberarSistema();
            }
        };

        function fazerLogin() {
            const usuario = document.getElementById('login-usuario').value.trim();
            const senha = document.getElementById('login-senha').value.trim();

            if (clientesSaaS[usuario] && clientesSaaS[usuario].senha === senha) {
                // Login com Sucesso
                dadosLojaAtual = clientesSaaS[usuario];
                // Salva no navegador para ele não precisar logar toda hora
                localStorage.setItem("mercadoIA_sessao", JSON.stringify(dadosLojaAtual));
                liberarSistema();
            } else {
                alert("❌ Acesso Negado. ID da loja ou senha incorretos.");
            }
        }

        function fazerLogout() {
            localStorage.removeItem("mercadoIA_sessao");
            dadosLojaAtual = null;
            document.getElementById('app-principal').classList.remove('flex');
            document.getElementById('app-principal').classList.add('hidden');
            document.getElementById('tela-login').classList.remove('hidden');
            document.getElementById('login-senha').value = '';
        }

        function liberarSistema() {
            // Esconde o login e mostra o sistema
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('app-principal').classList.remove('hidden');
            document.getElementById('app-principal').classList.add('flex');
            
            // Personaliza a tela com o nome da loja logada
            document.getElementById('display-nome-loja').innerText = dadosLojaAtual.nomeExibicao;
            document.getElementById('nome-loja-header').innerText = dadosLojaAtual.nomeExibicao.split(' ')[0]; // Pega só o primeiro nome pro botão de sair
        }

        // ==============================================================
        // LÓGICA DO CARRINHO (MANTIDA INTACTA)
        // ==============================================================
        let sacola = [];
        let timerSacola;

        function formatarMoeda(valor) { return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        
        function toggleCarrinho() { document.getElementById('painel-carrinho').classList.toggle('translate-x-full'); }

        document.getElementById("produto").addEventListener("keypress", function(event) {
            if (event.key === "Enter") { event.preventDefault(); ativarIA(); }
        });

        function adicionarAoCarrinho(nome, loja, preco) {
            sacola.push({ nome, loja, preco: parseFloat(preco) });
            atualizarInterfaceCarrinho();
            const painel = document.getElementById('painel-carrinho');
            painel.classList.remove('translate-x-full');
            if (timerSacola) clearTimeout(timerSacola);
            timerSacola = setTimeout(() => { painel.classList.add('translate-x-full'); }, 3000);
        }

        function removerDoCarrinho(index) {
            sacola.splice(index, 1);
            atualizarInterfaceCarrinho();
        }

        function atualizarInterfaceCarrinho() {
            const container = document.getElementById('itens-carrinho');
            const totalEl = document.getElementById('total-carrinho');
            const contador = document.getElementById('contador-sacola');
            const btn = document.getElementById('btn-finalizar');
            const form = document.getElementById('form-checkout');

            let total = sacola.reduce((acc, item) => acc + item.preco, 0);

            if (sacola.length > 0) {
                contador.textContent = sacola.length;
                contador.classList.remove('hidden');
            } else {
                contador.classList.add('hidden');
            }

            container.innerHTML = '';
            if (sacola.length === 0) {
                container.innerHTML = '<div class="text-gray-500 text-center mt-10">Sua sacola está vazia.</div>';
                totalEl.textContent = 'R$ 0,00';
                btn.disabled = true;
                btn.className = "w-full bg-gray-600 text-gray-300 font-bold py-4 rounded-xl uppercase tracking-widest cursor-not-allowed flex justify-center items-center gap-2";
                btn.innerHTML = 'Adicione itens para comprar';
                form.style.display = 'none';
                return;
            }

            form.style.display = 'block';
            btn.disabled = false;
            btn.className = "w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 rounded-xl transition-all uppercase tracking-widest flex justify-center items-center gap-2";
            btn.innerHTML = '<i class="fab fa-telegram-plane text-xl"></i> Finalizar Pedido';

            sacola.forEach((item, i) => {
                container.innerHTML += `
                    <div class="glass-panel p-4 rounded-xl flex justify-between items-center relative overflow-hidden mb-2 bg-black/40">
                        <div class="absolute left-0 top-0 h-full w-1 bg-cyan-500"></div>
                        <div class="flex-1 min-w-0 pl-3">
                            <p class="text-xs text-cyan-400 font-mono mb-1">${item.loja}</p>
                            <h4 class="text-sm font-medium text-white truncate">${item.nome}</h4>
                            <p class="text-white font-bold mt-1">${formatarMoeda(item.preco)}</p>
                        </div>
                        <button onclick="removerDoCarrinho(${i})" class="text-red-400 hover:text-red-300 w-8 h-8 flex items-center justify-center rounded-full bg-red-400/10 ml-2">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>`;
            });
            totalEl.textContent = formatarMoeda(total);
        }

        // ==============================================================
        // 3. CHECKOUT DINÂMICO (Usa os dados do usuário logado)
        // ==============================================================
        async function iniciarCheckout() {
            const nome = document.getElementById('cliente-nome').value.trim();
            const tel = document.getElementById('cliente-telefone').value.trim();
            const cep = document.getElementById('cliente-cep').value.trim();
            const rua = document.getElementById('cliente-rua').value.trim();
            const numero = document.getElementById('cliente-numero').value.trim();
            const bairro = document.getElementById('cliente-bairro').value.trim();
            const pag = document.getElementById('cliente-pagamento').value;
            const btn = document.getElementById('btn-finalizar');

            if (!nome || !tel || !cep || !rua || !numero || !pag) {
                alert("Preencha todos os dados obrigatórios do cliente.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processando...';

            let resumo = `🚨 *NOVO PEDIDO: ${dadosLojaAtual.nomeExibicao.toUpperCase()}* 🚨\n\n`;
            resumo += `👤 *Cliente:* ${nome}\n`;
            resumo += `📱 *Telefone:* ${tel}\n`;
            resumo += `📍 *Endereço:* ${rua}, Nº ${numero}\n`;
            if (bairro) resumo += `🏘️ *Bairro/Compl:* ${bairro}\n`;
            resumo += `📮 *CEP:* ${cep}\n`;
            resumo += `💳 *Pagamento:* ${pag}\n\n`;
            resumo += `🛒 *ITENS DA SACOLA:*\n`;

            let total = 0;
            sacola.forEach(item => {
                resumo += `• ${item.nome} (${item.loja}) - R$ ${item.preco.toFixed(2)}\n`;
                total += item.preco;
            });
            resumo += `\n💰 *VALOR TOTAL:* R$ ${total.toFixed(2)}\n`;

            // A MÁGICA DO SaaS ESTÁ AQUI: Ele não usa mais chave fixa, usa a chave de quem fez o login!
            const botToken = dadosLojaAtual.botToken;
            const chatId = dadosLojaAtual.chatId;
            const urlTelegram = `https://api.telegram.org/bot${botToken}/sendMessage`;

            try {
                const response = await fetch(urlTelegram, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: resumo,
                        parse_mode: "Markdown"
                    })
                });

                if (!response.ok) throw new Error("Erro de comunicação com o Telegram");

                alert("✅ Pedido despachado com sucesso para a central: " + dadosLojaAtual.nomeExibicao);

                sacola = [];
                document.getElementById('cliente-nome').value = '';
                document.getElementById('cliente-telefone').value = '';
                document.getElementById('cliente-cep').value = '';
                document.getElementById('cliente-rua').value = '';
                document.getElementById('cliente-numero').value = '';
                document.getElementById('cliente-bairro').value = '';
                document.getElementById('cliente-pagamento').value = '';
                
                atualizarInterfaceCarrinho();
                document.getElementById('painel-carrinho').classList.add('translate-x-full');

            } catch (error) {
                alert("❌ Erro ao enviar o pedido. Verifique as chaves do Telegram da loja.");
                btn.disabled = false;
                btn.innerHTML = '<i class="fab fa-telegram-plane text-xl"></i> Finalizar Pedido';
            }
        }

        // ==============================================================
        // INTEGRAÇÃO CLOUDFLARE E UI (MANTIDAS INTACTAS)
        // ==============================================================
        async function ativarIA() {
            const query = document.getElementById('produto').value.trim();
            if (!query) return;

            const feed = document.getElementById('feed-ofertas');
            const status = document.getElementById('status-container');
            const btn = document.getElementById('btn-buscar');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Auditando Mercados';
            feed.innerHTML = '';
            status.classList.remove('hidden');
            status.innerHTML = `<div class="inline-flex items-center gap-3 text-cyan-400 font-mono text-sm"><i class="fas fa-radar fa-spin text-xl"></i> A IA está analisando os preços em tempo real...</div>`;

            try {
                const urlDoRobo = `https://mercado.gpartnerllc.workers.dev/?produto=${encodeURIComponent(query)}`;
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 18000);

                const res = await fetch(urlDoRobo, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!res.ok) throw new Error(`Falha na API (Status HTTP: ${res.status})`);
                const data = await res.json();

                btn.disabled = false;
                btn.innerHTML = 'Buscar';
                status.classList.add('hidden');

                if (data.erro) throw new Error(data.erro);
                if (!Array.isArray(data) || data.length === 0) throw new Error('A IA não conseguiu estruturar as ofertas.');

                data.forEach((oferta, i) => {
                    const precoNum = parseFloat(oferta.preco) || 0;
                    if(oferta.loja === "⚠️ ALERTA") throw new Error(oferta.nome);
                    else desenharCard(oferta.loja, oferta.nome, precoNum, i === 0);
                });

            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = 'Buscar';
                let msg = err.message;
                if (err.name === 'AbortError') msg = "O servidor demorou muito para conectar. Tente novamente.";
                status.innerHTML = `<div class="inline-block glass-panel border-red-500/30 bg-red-900/20 text-red-300 px-6 py-5 rounded-xl text-sm font-mono"><i class="fas fa-exclamation-triangle mr-2"></i> Falha: ${msg}</div>`;
            }
        }

        function desenharCard(loja, produto, preco, isMelhorPreco) {
            const feed = document.getElementById('feed-ofertas');
            const precoFormatado = formatarMoeda(preco);
            const nomeEsc = produto.replace(/'/g, "").replace(/"/g, "");
            const lojaEsc = loja.replace(/'/g, "").replace(/"/g, "");

            const botaoAcao = `<button onclick="adicionarAoCarrinho('${nomeEsc}', '${lojaEsc}', ${preco})" class="w-full text-center bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-bold py-3 rounded-xl transition-colors uppercase tracking-wider shadow-[0_0_10px_rgba(8,145,178,0.4)]"><i class="fas fa-cart-plus mr-2"></i> Por na Sacola</button>`;
            
            const cardHTML = `
                <div class="glass-panel bg-black/60 p-6 rounded-2xl relative flex flex-col justify-between animate-slide-up ${isMelhorPreco ? 'border-cyan-500/50 shadow-[0_0_30px_rgba(8,145,178,0.15)] scale-[1.02]' : ''}">
                    ${isMelhorPreco ? `<div class="absolute -top-3 left-6 bg-cyan-500 text-black text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">Melhor Preço</div>` : ''}
                    <div>
                        <div class="flex justify-between items-start mb-4 mt-2">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest drop-shadow">${loja}</span>
                            <span class="text-green-400 text-xs bg-green-400/20 px-2 py-1 rounded backdrop-blur-sm"><i class="fas fa-check"></i> Auditado</span>
                        </div>
                        <h3 class="text-lg font-medium text-white mb-6 line-clamp-3 drop-shadow-md">${produto}</h3>
                    </div>
                    <div class="flex flex-col mt-auto border-t border-white/10 pt-4 gap-4">
                        <div class="flex flex-col">
                            <span class="text-[10px] text-gray-300 uppercase tracking-widest mb-1 drop-shadow">Preço Atualizado</span>
                            <span class="text-3xl font-bold ${isMelhorPreco ? 'text-cyan-400' : 'text-white'} drop-shadow-lg">${precoFormatado}</span>
                        </div>
                        ${botaoAcao}
                    </div>
                </div>`;
            feed.insertAdjacentHTML('beforeend', cardHTML);
        }

        // ESCUDO B2B (Anti Cópia)
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.onkeydown = function(e) {
            if (e.keyCode === 123) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode === 'I'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode === 'J'.charCodeAt(0)) return false;

<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA | Comparador de Elite - MERCADO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#050505',
                        glassBg: 'rgba(20, 20, 20, 0.7)',
                    },
                    animation: {
                        'slide-up': 'slideUp 0.5s ease-out forwards',
                        'slide-in-right': 'slideInRight 0.3s ease-out forwards'
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideInRight: {
                            '0%': { transform: 'translateX(100%)' },
                            '100%': { transform: 'translateX(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #ededed; font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-darkBg min-h-screen bg-grid relative overflow-x-hidden flex flex-col items-center pt-16">
    <div class="absolute top-[-10%] left-[20%] w-[600px] h-[600px] bg-cyan-900/30 rounded-full blur-[120px] pointer-events-none z-0"></div>
    
    <button onclick="toggleCarrinho()" class="fixed top-6 right-6 z-50 glass-panel p-4 rounded-full text-cyan-400 hover:text-white hover:bg-cyan-600/20 transition-all shadow-[0_0_15px_rgba(8,145,178,0.3)]">
        <i class="fas fa-shopping-bag text-xl relative">
            <span id="contador-sacola" class="absolute -top-3 -right-4 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden">0</span>
        </i>
    </button>

    <div class="w-full max-w-6xl px-6 relative z-10">
        <header class="text-center mb-16">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full glass-panel text-xs text-cyan-400 font-mono mb-6 uppercase tracking-widest border-cyan-500/30">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Sistema B2B x C
            </div>
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-4 text-white">Auditoria e Compras</h1>
            <p class="text-gray-400 text-lg max-w-2xl mx-auto font-light">
                Pesquise, compare e adicione à sacola os melhores preços do mercado.
            </p>
        </header>

        <div class="glass-panel p-2 rounded-2xl flex items-center shadow-2xl max-w-3xl mx-auto mb-16 relative hover:border-cyan-500/50 transition-colors duration-300">
            <i class="fas fa-search text-gray-500 ml-4 text-xl"></i>
            <input type="text" id="produto" placeholder="Ex: Arroz Camil 5kg" class="w-full bg-transparent border-none outline-none text-white px-4 py-4 text-lg placeholder-gray-600">
            <button onclick="ativarIA()" id="btn-buscar" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-8 rounded-xl transition-all shadow-[0_0_15px_rgba(8,145,178,0.5)] min-w-[140px]">
                Buscar
            </button>
        </div>

        <div id="status-container" class="text-center mb-8 hidden"></div>
        <div id="feed-ofertas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20"></div>
    </div>

    <!-- Painel Carrinho -->
    <div id="painel-carrinho" class="fixed top-0 right-0 w-full md:w-[450px] h-full glass-panel bg-[#0a0a0a]/95 z-50 transform translate-x-full transition-transform duration-300 flex flex-col border-l border-white/10">
        <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/50">
            <h2 class="text-xl font-bold text-white"><i class="fas fa-shopping-bag mr-2 text-cyan-400"></i> Sua Sacola</h2>
            <button onclick="toggleCarrinho()" class="text-gray-400 hover:text-white transition"><i class="fas fa-times text-2xl"></i></button>
        </div>
        <div id="itens-carrinho" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar"></div>
        <div class="p-6 border-t border-white/10 bg-black/80">
            <div class="flex justify-between items-center mb-6">
                <span class="text-gray-400 uppercase tracking-widest text-sm">Total a Pagar</span>
                <span id="total-carrinho" class="text-3xl font-bold text-cyan-400">R$ 0,00</span>
            </div>
            <div class="space-y-3 mb-6" id="form-checkout" style="display: none;">
                <input type="text" id="cliente-nome" placeholder="Nome Completo" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition">
                <input type="text" id="cliente-telefone" placeholder="Telefone / WhatsApp" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition">
                <textarea id="cliente-endereco" placeholder="Endereço de Entrega Completo" rows="2" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition resize-none"></textarea>
                <select id="cliente-pagamento" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition appearance-none">
                    <option value="" disabled selected class="text-gray-400">Selecione a Forma de Pagamento</option>
                    <option value="Pix">Pix (Chave enviada na confirmação)</option>
                    <option value="Cartão na Entrega">Cartão de Crédito/Débito (Na Entrega)</option>
                    <option value="Dinheiro">Dinheiro (Na Entrega)</option>
                </select>
            </div>
            <button id="btn-finalizar" onclick="iniciarCheckout()" disabled class="w-full bg-gray-600 text-gray-300 font-bold py-4 rounded-xl transition-all uppercase tracking-widest cursor-not-allowed">
                Adicione itens para comprar
            </button>
        </div>
    </div>

    <script>
        let sacola = [];

        function formatarMoeda(valor) {
            return parseFloat(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        function toggleCarrinho() {
            document.getElementById('painel-carrinho').classList.toggle('translate-x-full');
        }

        function adicionarAoCarrinho(nome, loja, preco) {
            preco = parseFloat(preco);
            if (isNaN(preco)) return;
            sacola.push({ nome, loja, preco });
            atualizarInterfaceCarrinho();
            document.getElementById('painel-carrinho').classList.remove('translate-x-full');
        }

        function removerDoCarrinho(index) {
            sacola.splice(index, 1);
            atualizarInterfaceCarrinho();
        }

        function atualizarInterfaceCarrinho() {
            const container = document.getElementById('itens-carrinho');
            const totalElement = document.getElementById('total-carrinho');
            const contador = document.getElementById('contador-sacola');
            const btn = document.getElementById('btn-finalizar');
            const form = document.getElementById('form-checkout');

            let total = sacola.reduce((sum, item) => sum + item.preco, 0);

            contador.innerText = sacola.length;
            contador.classList.toggle('hidden', sacola.length === 0);

            if (sacola.length === 0) {
                container.innerHTML = '<div class="text-gray-500 text-center mt-10">Sua sacola está vazia.</div>';
                totalElement.innerText = 'R$ 0,00';
                btn.disabled = true;
                btn.classList.add('bg-gray-600', 'text-gray-300', 'cursor-not-allowed');
                btn.classList.remove('bg-cyan-600', 'hover:bg-cyan-500', 'text-white');
                btn.innerText = 'Adicione itens para comprar';
                form.style.display = 'none';
                return;
            }

            form.style.display = 'block';
            btn.disabled = false;
            btn.classList.remove('bg-gray-600', 'text-gray-300', 'cursor-not-allowed');
            btn.classList.add('bg-cyan-600', 'hover:bg-cyan-500', 'text-white');
            btn.innerText = 'Fechar Pedido Via WhatsApp';

            container.innerHTML = '';
            sacola.forEach((item, i) => {
                container.innerHTML += `
                    <div class="glass-panel p-4 rounded-xl flex justify-between items-center relative overflow-hidden">
                        <div class="absolute left-0 top-0 h-full w-1 bg-cyan-500"></div>
                        <div>
                            <p class="text-xs text-cyan-400 font-mono mb-1">${item.loja}</p>
                            <h4 class="text-sm font-medium text-white line-clamp-1">${item.nome}</h4>
                            <p class="text-white font-bold mt-1">${formatarMoeda(item.preco)}</p>
                        </div>
                        <button onclick="removerDoCarrinho(${i})" class="text-red-400 hover:text-red-300 w-8 h-8 flex items-center justify-center rounded-full bg-red-400/10">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>`;
            });

            totalElement.innerText = formatarMoeda(total);
        }

        function iniciarCheckout() {
            const nome = document.getElementById('cliente-nome').value.trim();
            const tel = document.getElementById('cliente-telefone').value.trim();
            const end = document.getElementById('cliente-endereco').value.trim();
            const pag = document.getElementById('cliente-pagamento').value;

            if (!nome || !tel || !end || !pag) {
                alert("Preencha todos os campos obrigatórios.");
                return;
            }

            let texto = `🚨 *NOVO PEDIDO - MERCADO* 🚨\n\n`;
            texto += `👤 *Cliente:* ${nome}\n`;
            texto += `📱 *Telefone:* ${tel}\n`;
            texto += `📍 *Endereço:* ${end}\n`;
            texto += `💳 *Pagamento:* ${pag}\n\n`;
            texto += `🛒 *ITENS:*\n`;
            let total = 0;
            sacola.forEach(item => {
                texto += `• ${item.nome} (${item.loja}) - ${formatarMoeda(item.preco)}\n`;
                total += item.preco;
            });
            texto += `\n💰 *TOTAL:* ${formatarMoeda(total)}`;

            const encoded = encodeURIComponent(texto);
            window.open(`https://wa.me/?text=${encoded}`, '_blank');

            // Limpa tudo
            sacola = [];
            document.getElementById('cliente-nome').value = '';
            document.getElementById('cliente-telefone').value = '';
            document.getElementById('cliente-endereco').value = '';
            document.getElementById('cliente-pagamento').value = '';
            atualizarInterfaceCarrinho();
            toggleCarrinho();
        }

        async function ativarIA() {
            const input = document.getElementById('produto');
            const query = input.value.trim();
            if (!query) return;

            const feed = document.getElementById('feed-ofertas');
            const status = document.getElementById('status-container');
            const btn = document.getElementById('btn-buscar');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Buscando...';
            feed.innerHTML = '';
            status.classList.remove('hidden');
            status.innerHTML = `<div class="inline-flex items-center gap-3 text-cyan-400 font-mono text-sm"><i class="fas fa-radar fa-spin text-xl"></i> Buscando preços atualizados...</div>`;

            try {
                // =================================================
                // MUDE AQUI PARA O SEU WORKER ATIVO (obrigatório!)
                // Exemplo: https://meu-comparador-2026.seunome.workers.dev/
                const url = `https://ia-sellers.gpartnerllc.workers.dev/?produto=${encodeURIComponent(query)}`;
                // =================================================

                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 12000);

                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timeout);

                if (!res.ok) throw new Error(`Erro ${res.status}: ${res.statusText}`);

                const type = res.headers.get('content-type') || '';
                if (!type.includes('application/json')) throw new Error('Resposta inválida (não é JSON)');

                const data = await res.json();

                btn.disabled = false;
                btn.innerHTML = 'Buscar';
                status.classList.add('hidden');

                if (data.erro) throw new Error(data.erro);
                if (!Array.isArray(data) || data.length === 0) throw new Error('Nenhuma oferta encontrada.');

                // Ordena por preço crescente
                data.sort((a, b) => parseFloat(a.preco || 999999) - parseFloat(b.preco || 999999));

                data.forEach((oferta, i) => {
                    const precoNum = parseFloat(oferta.preco) || 0;
                    const isMelhor = i === 0 && precoNum > 0;
                    const nomeLimpo = (oferta.nome || '').replace(/['"]/g, '').trim();
                    desenharCard(oferta.loja || 'Loja', oferta.nome || 'Produto', precoNum, oferta.link || '#', isMelhor, i, nomeLimpo);
                });

            } catch (err) {
                let msg = err.message;
                if (err.name === 'AbortError') msg = 'Tempo esgotado (12s). Tente produto mais específico.';
                else if (msg.includes('fetch')) msg = 'Falha na conexão com o servidor.';

                btn.disabled = false;
                btn.innerHTML = 'Buscar';
                status.innerHTML = `
                    <div class="inline-block glass-panel border-red-500/40 bg-red-950/30 text-red-300 px-6 py-5 rounded-xl text-sm font-mono leading-relaxed max-w-xl mx-auto">
                        <i class="fas fa-exclamation-circle mr-2 text-lg"></i>
                        <strong>Erro:</strong> ${msg}<br>
                        <span class="text-xs opacity-80 mt-2 block">Exemplos válidos: "Arroz Camil 5kg", "Leite Italac 1L", "Café Pilão 500g"</span>
                    </div>`;
            }
        }

        function desenharCard(loja, produto, preco, link, isMelhorPreco, index, nomeLimpo) {
            const feed = document.getElementById('feed-ofertas');
            const delay = index * 120;
            const precoStr = preco > 0 ? formatarMoeda(preco) : 'Consultar';
            const oculto = preco <= 0.01 || precoStr === 'Consultar';

            const botao = oculto
                ? `<a href="${link}" target="_blank" class="w-full text-center bg-white/10 hover:bg-white/20 text-white text-sm font-bold py-3 rounded-xl transition-colors uppercase tracking-wider"><i class="fas fa-external-link-alt mr-2"></i> Ver Oferta</a>`
                : `<button onclick="adicionarAoCarrinho('${nomeLimpo}', '${loja.replace(/['"]/g,'')}', ${preco})" class="w-full text-center bg-cyan-600 hover:bg-cyan-500 text-white text-sm font-bold py-3 rounded-xl transition-colors uppercase tracking-wider shadow-[0_0_10px_rgba(8,145,178,0.4)]"><i class="fas fa-cart-plus mr-2"></i> Adicionar</button>`;

            const card = `
                <div class="glass-panel p-6 rounded-2xl relative flex flex-col justify-between hover:-translate-y-2 transition-transform duration-300 animate-slide-up ${isMelhorPreco ? 'border-cyan-500/50 shadow-[0_0_30px_rgba(8,145,178,0.25)] scale-[1.02]' : ''}" style="animation-delay: ${delay}ms;">
                    ${isMelhorPreco && !oculto ? `<div class="absolute -top-3 left-6 bg-cyan-500 text-black text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-[0_0_10px_rgba(6,182,212,0.8)]"><i class="fas fa-trophy mr-1"></i> Melhor Preço</div>` : ''}
                    <div>
                        <div class="flex justify-between items-start mb-4 mt-2">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">${loja}</span>
                            <span class="text-xs px-2 py-1 rounded ${oculto ? 'text-yellow-400 bg-yellow-400/10' : 'text-green-400 bg-green-400/10'}">
                                <i class="fas ${oculto ? 'fa-eye' : 'fa-check'} mr-1"></i> ${oculto ? 'Verificar' : 'Disponível'}
                            </span>
                        </div>
                        <h3 class="text-lg font-medium text-white leading-tight mb-6 line-clamp-3">${produto}</h3>
                    </div>
                    <div class="flex flex-col mt-auto border-t border-white/5 pt-4 gap-4">
                        <div class="flex flex-col">
                            <span class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">${oculto ? 'Preço no Site' : 'Preço'}</span>
                            <span class="text-3xl font-bold ${isMelhorPreco ? 'text-cyan-400' : 'text-white'} tracking-tighter">${precoStr}</span>
                        </div>
                        ${botao}
                    </div>
                </div>`;

            feed.insertAdjacentHTML('beforeend', card);
        }
    </script>
</body>
</html>

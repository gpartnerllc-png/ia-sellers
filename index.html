<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Mercado IA | Marketplace Nacional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <link rel="icon" href="https://mail.google.com/favicon.ico" type="image/x-icon" />
    
    <script>
        tailwind.config = { theme: { extend: { colors: { darkBg: '#050505', glassBg: 'rgba(20, 20, 20, 0.7)' } } } }
    </script>
    <style>
        body { 
            color: #ededed; 
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(5, 5, 5, 0.50), rgba(5, 5, 5, 0.75)), url('https://images.unsplash.com/photo-1587293852726-70cdb56c2866?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            overscroll-behavior-x: none;
        }
        input, textarea, select, button { -webkit-user-select: auto; -moz-user-select: auto; -ms-user-select: auto; user-select: auto; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen relative overflow-x-hidden flex flex-col items-center">

    <div class="absolute top-[-10%] left-[20%] w-[600px] h-[600px] bg-cyan-900/40 rounded-full blur-[120px] pointer-events-none z-0"></div>

    <div id="tela-login" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90 backdrop-blur-md transition-opacity duration-500 p-4">
        <div class="glass-panel bg-black/60 p-8 md:p-10 rounded-2xl w-full max-w-md shadow-[0_0_40px_rgba(8,145,178,0.2)] border-cyan-500/30">
            <div class="text-center mb-8">
                <i class="fas fa-map-marker-alt text-5xl text-cyan-400 mb-4"></i>
                <h2 class="text-2xl md:text-3xl font-bold text-white">Mercado Local</h2>
                <p class="text-gray-400 text-xs md:text-sm mt-2">Escolha sua região para ver os mercados disponíveis.</p>
            </div>
            <div class="space-y-4">
                <input type="text" id="login-nome" placeholder="Seu Nome Completo" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white outline-none focus:border-cyan-500 transition text-sm md:text-base">
                <input type="tel" id="login-telefone" placeholder="Seu WhatsApp (com DDD)" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-white outline-none focus:border-cyan-500 transition text-sm md:text-base">
                
                <select id="login-regiao" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-4 text-gray-300 outline-none focus:border-cyan-500 transition appearance-none text-sm md:text-base">
                    <option value="" disabled selected>Selecione sua Cidade/Região</option>
                    <option value="brasilia" class="bg-black text-white">Brasília - DF</option>
                    <option value="aguas_lindas" class="bg-black text-white">Águas Lindas - GO</option>
                    <option value="maracai" class="bg-black text-white">Maracaí - SP</option>
                </select>

                <button onclick="fazerCadastroCliente()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-4 rounded-xl transition-all uppercase tracking-widest mt-4 shadow-[0_0_15px_rgba(8,145,178,0.5)] text-sm md:text-base">
                    Acessar Supermercados
                </button>
            </div>
        </div>
    </div>

    <div id="app-principal" class="w-full flex-col items-center hidden">
        
        <div class="fixed top-0 left-0 w-full z-40 glass-panel bg-[#050505]/98 border-b border-white/10 shadow-2xl flex flex-col pb-4">
            
            <nav class="w-full px-4 py-2 md:py-3 flex justify-between items-center">
                <button onclick="fazerLogout()" class="flex items-center gap-2 md:gap-3 text-gray-300 hover:text-red-400 transition-colors group">
                    <div class="bg-white/5 group-hover:bg-red-500/20 p-2 rounded-full transition-colors flex items-center justify-center h-8 w-8"><i class="fas fa-sign-out-alt"></i></div>
                    <div class="flex flex-col text-left">
                        <span id="display-nome-cliente" class="text-xs md:text-sm font-bold text-cyan-400 leading-tight truncate max-w-[100px] md:max-w-[150px]">Olá, Cliente</span>
                        <span id="display-regiao" class="text-[9px] md:text-[10px] uppercase tracking-widest opacity-80 text-yellow-500 truncate max-w-[100px] md:max-w-[150px]"><i class="fas fa-map-pin"></i> Região</span>
                    </div>
                </button>

                <button onclick="toggleCarrinho()" class="relative flex items-center gap-2 p-2 md:px-4 text-cyan-400 hover:text-white transition-colors bg-white/5 hover:bg-cyan-600/30 rounded-xl border border-white/5">
                    <i class="fas fa-shopping-bag text-lg md:text-xl"></i>
                    <span class="hidden md:inline text-sm font-bold uppercase tracking-wider pr-1">Sacola</span>
                    <span id="contador-sacola" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full hidden shadow-md border border-[#050505]">0</span>
                </button>
            </nav>

            <div class="w-full max-w-4xl mx-auto px-4 pt-1 flex flex-col items-center">
                <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-tight mb-1 md:mb-2 text-white drop-shadow-lg text-center leading-tight">
                    Mercado IA | Marketplace Nacional
                </h1>
                <p class="text-gray-300 text-[10px] sm:text-xs md:text-sm max-w-2xl text-center font-light leading-snug mb-3 md:mb-4">
                    Escolha as ofertas, monte sua sacola e os atacadistas da sua cidade entregam na sua porta.
                </p>

                <div class="w-full glass-panel p-1.5 md:p-2 rounded-xl flex items-center bg-[#0a0a0a]/90 border border-cyan-500/40 shadow-inner">
                    <i class="fas fa-search text-gray-400 ml-3 text-base md:text-lg"></i>
                    <input type="text" id="produto" placeholder="Buscar produto... (Ex: Arroz 5kg)" class="w-full bg-transparent border-none outline-none text-white px-3 py-2 md:py-3 text-sm md:text-base placeholder-gray-500 focus:ring-0">
                    <button onclick="ativarIA()" id="btn-buscar" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-2 md:py-3 px-5 md:px-8 rounded-lg transition-all shadow-[0_0_15px_rgba(8,145,178,0.5)] min-w-[90px] md:min-w-[120px] text-xs md:text-sm">
                        Buscar
                    </button>
                </div>
            </div>
        </div>
        <div class="w-full max-w-6xl px-4 md:px-6 relative z-10 mx-auto mt-[220px] sm:mt-[240px] md:mt-[260px]">
            <div id="status-container" class="text-center mb-6 hidden"></div>
            <div id="feed-ofertas" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6 pb-20"></div>
        </div>
    </div>

    <div id="painel-carrinho" class="fixed top-0 right-0 w-full sm:w-[450px] h-full glass-panel bg-[#050505]/98 z-50 transform translate-x-full transition-transform duration-300 flex flex-col border-l border-white/10 shadow-2xl">
        <div class="p-6 border-b border-white/10 flex justify-between items-center bg-black/50">
            <h2 class="text-xl font-bold text-white"><i class="fas fa-shopping-bag mr-2 text-cyan-400"></i> Sua Sacola</h2>
            <button onclick="toggleCarrinho()" class="text-gray-400 hover:text-white transition p-2 bg-white/5 rounded-full h-10 w-10 flex items-center justify-center"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="itens-carrinho" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 no-scrollbar"></div>
        
        <div class="p-4 md:p-6 border-t border-white/10 bg-black/80">
            <div class="flex justify-between items-center mb-4 md:mb-6">
                <span class="text-gray-400 uppercase tracking-widest text-xs md:text-sm">Total do Pedido</span>
                <span id="total-carrinho" class="text-2xl md:text-3xl font-bold text-cyan-400">R$ 0,00</span>
            </div>
            
            <div class="space-y-2 md:space-y-3 mb-4 md:mb-6" id="form-checkout" style="display: none;">
                <input type="text" id="cliente-nome" readonly class="w-full bg-black/30 border border-white/5 rounded-lg px-4 py-3 text-gray-500 outline-none cursor-not-allowed text-sm">
                <input type="text" id="cliente-telefone" readonly class="w-full bg-black/30 border border-white/5 rounded-lg px-4 py-3 text-gray-500 outline-none cursor-not-allowed text-sm">
                
                <p class="text-cyan-400 text-[10px] md:text-xs uppercase tracking-widest mt-2 font-bold mb-1 ml-1">Endereço de Entrega</p>
                <div class="flex gap-2">
                    <input type="text" id="cliente-cep" placeholder="CEP" class="w-1/3 bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition text-sm">
                    <input type="text" id="cliente-rua" placeholder="Rua / Av." class="w-2/3 bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition text-sm">
                </div>
                
                <div class="flex gap-2">
                    <input type="text" id="cliente-numero" placeholder="Nº" class="w-1/3 bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition text-sm">
                    <input type="text" id="cliente-bairro" placeholder="Bairro / Compl." class="w-2/3 bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition text-sm">
                </div>

                <select id="cliente-pagamento" class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white outline-none focus:border-cyan-500 transition appearance-none mt-2 text-sm">
                    <option value="" disabled selected class="text-gray-400">Forma de Pagamento</option>
                    <option value="Pix" class="text-gray-900">Pix (Entregador)</option>
                    <option value="Dinheiro" class="text-gray-900">Dinheiro</option>
                    <option value="Cartão" class="text-gray-900">Cartão</option>
                </select>
            </div>

            <button id="btn-finalizar" onclick="iniciarCheckoutMarketplace()" disabled class="w-full bg-gray-600 text-gray-300 font-bold py-3 md:py-4 rounded-xl transition-all uppercase tracking-widest cursor-not-allowed flex justify-center items-center gap-2 shadow-[0_0_15px_rgba(8,145,178,0.3)] text-sm md:text-base">
                Adicione itens para comprar
            </button>
        </div>
    </div>

    <script>
        // ==============================================================
        // GERENCIAMENTO DA SESSÃO DO CLIENTE
        // ==============================================================
        let clienteLogado = null;

        const nomesRegioes = {
            "brasilia": "Brasília - DF",
            "aguas_lindas": "Águas Lindas - GO",
            "maracai": "Maracaí - SP"
        };

        window.onload = function() {
            const sessao = localStorage.getItem("mercadoIA_cliente");
            if (sessao) {
                clienteLogado = JSON.parse(sessao);
                liberarAcessoCliente();
            }
        };

        function fazerCadastroCliente() {
            const nome = document.getElementById('login-nome').value.trim();
            const tel = document.getElementById('login-telefone').value.trim();
            const regiao = document.getElementById('login-regiao').value;

            if (nome.length < 3 || tel.length < 8 || !regiao) {
                alert("⚠️ Preencha nome, WhatsApp e Selecione sua Cidade.");
                return;
            }

            clienteLogado = { nome: nome, telefone: tel, regiao: regiao };
            localStorage.setItem("mercadoIA_cliente", JSON.stringify(clienteLogado));
            liberarAcessoCliente();
        }

        function fazerLogout() {
            localStorage.removeItem("mercadoIA_cliente");
            clienteLogado = null;
            document.getElementById('app-principal').classList.remove('flex');
            document.getElementById('app-principal').classList.add('hidden');
            document.getElementById('tela-login').classList.remove('hidden');
            document.getElementById('login-nome').value = '';
            document.getElementById('login-telefone').value = '';
            document.getElementById('login-regiao').value = '';
        }

        function liberarAcessoCliente() {
            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('app-principal').classList.remove('hidden');
            document.getElementById('app-principal').classList.add('flex');
            
            const primeiroNome = clienteLogado.nome.split(' ')[0];
            document.getElementById('display-nome-cliente').innerText = `Olá, ${primeiroNome}`;
            document.getElementById('display-regiao').innerHTML = `<i class="fas fa-map-pin"></i> ${nomesRegioes[clienteLogado.regiao]}`;
            
            document.getElementById('cliente-nome').value = clienteLogado.nome;
            document.getElementById('cliente-telefone').value = clienteLogado.telefone;
        }

        // ==============================================================
        // LÓGICA DO CARRINHO
        // ==============================================================
        let sacola = [];
        let timerSacola;

        function formatarMoeda(valor) { return Number(valor).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
        function toggleCarrinho() { document.getElementById('painel-carrinho').classList.toggle('translate-x-full'); }

        document.getElementById("produto").addEventListener("keypress", function(event) {
            if (event.key === "Enter") { 
                event.preventDefault(); 
                ativarIA(); 
                document.getElementById("produto").blur(); // Oculta o teclado ao buscar
            }
        });

        function adicionarAoCarrinho(nome, loja, preco) {
            sacola.push({ nome, loja, preco: parseFloat(preco) });
            atualizarInterfaceCarrinho();
            const painel = document.getElementById('painel-carrinho');
            painel.classList.remove('translate-x-full');
            if (timerSacola) clearTimeout(timerSacola);
            timerSacola = setTimeout(() => { painel.classList.add('translate-x-full'); }, 2500);
        }

        function removerDoCarrinho(index) {
            sacola.splice(index, 1);
            atualizarInterfaceCarrinho();
        }

        function atualizarInterfaceCarrinho() {
            const container = document.getElementById('itens-carrinho');
            const totalEl = document.getElementById('total-carrinho');
            const contador = document.getElementById('contador-sacola');
            const btn = document.getElementById('btn-finalizar');
            const form = document.getElementById('form-checkout');

            let total = sacola.reduce((acc, item) => acc + item.preco, 0);

            if (sacola.length > 0) {
                contador.textContent = sacola.length;
                contador.classList.remove('hidden');
            } else {
                contador.classList.add('hidden');
            }

            container.innerHTML = '';
            if (sacola.length === 0) {
                container.innerHTML = '<div class="text-gray-500 text-center mt-10 text-sm">Sua sacola está vazia.</div>';
                totalEl.textContent = 'R$ 0,00';
                btn.disabled = true;
                btn.className = "w-full bg-gray-600 text-gray-300 font-bold py-3 md:py-4 rounded-xl uppercase tracking-widest cursor-not-allowed flex justify-center items-center gap-2 text-sm md:text-base";
                btn.innerHTML = 'Adicione itens para comprar';
                form.style.display = 'none';
                return;
            }

            form.style.display = 'block';
            btn.disabled = false;
            btn.className = "w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 md:py-4 rounded-xl transition-all uppercase tracking-widest flex justify-center items-center gap-2 text-sm md:text-base shadow-[0_0_15px_rgba(8,145,178,0.4)]";
            btn.innerHTML = '<i class="fab fa-telegram-plane text-xl"></i> Finalizar Pedidos';

            sacola.forEach((item, i) => {
                container.innerHTML += `
                    <div class="glass-panel p-3 md:p-4 rounded-xl flex justify-between items-center relative overflow-hidden mb-2 bg-black/40">
                        <div class="absolute left-0 top-0 h-full w-1 bg-cyan-500"></div>
                        <div class="flex-1 min-w-0 pl-2 md:pl-3">
                            <p class="text-[10px] md:text-xs text-cyan-400 font-mono mb-1">${item.loja}</p>
                            <h4 class="text-xs md:text-sm font-medium text-white truncate pr-2">${item.nome}</h4>
                            <p class="text-white font-bold mt-1 text-sm md:text-base">${formatarMoeda(item.preco)}</p>
                        </div>
                        <button onclick="removerDoCarrinho(${i})" class="text-red-400 hover:text-red-300 w-8 h-8 flex items-center justify-center rounded-full bg-red-400/10 ml-1">
                            <i class="fas fa-trash-alt text-sm"></i>
                        </button>
                    </div>`;
            });
            totalEl.textContent = formatarMoeda(total);
        }

        // ==============================================================
        // CENTRAL DE ROTEAMENTO TELEGRAM
        // ==============================================================
        const franquiasTelegram = {
            "brasilia": {
                "Carrefour": { botToken: "8671565303:AAHA8RQZTmrdejIR0lpW4wFqDOhmnX88k9k", chatId: "1703808186" },
                "Atacadão": { botToken: "8671565303:AAHA8RQZTmrdejIR0lpW4wFqDOhmnX88k9k", chatId: "1703808186" },
                "Tatico": { botToken: "8671565303:AAHA8RQZTmrdejIR0lpW4wFqDOhmnX88k9k", chatId: "1703808186" }
            },
            "aguas_lindas": {
                "Atacadão": { botToken: "8671565303:AAHA8RQZTmrdejIR0lpW4wFqDOhmnX88k9k", chatId: "1703808186" },
                "Dia a Dia": { botToken: "8671565303:AAHA8RQZTmrdejIR0lpW4wFqDOhmnX88k9k", chatId: "1703808186" }
            },
            "maracai": {
                "Atacadão": { botToken: "8671565303:AAHA8RQZTmrdejIR0lpW4wFqDOhmnX88k9k", chatId: "1703808186" },
                "Mercado Avenida": { botToken: "8671565303:AAHA8RQZTmrdejIR0lpW4wFqDOhmnX88k9k", chatId: "1703808186" }
            }
        };

        async function iniciarCheckoutMarketplace() {
            const cep = document.getElementById('cliente-cep').value.trim();
            const rua = document.getElementById('cliente-rua').value.trim();
            const numero = document.getElementById('cliente-numero').value.trim();
            const bairro = document.getElementById('cliente-bairro').value.trim();
            const pag = document.getElementById('cliente-pagamento').value;
            const btn = document.getElementById('btn-finalizar');

            if (!cep || !rua || !numero || !pag) {
                alert("Preencha todos os dados do endereço de entrega.");
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Despachando...';

            const pedidosPorLoja = {};
            sacola.forEach(item => {
                if (!pedidosPorLoja[item.loja]) pedidosPorLoja[item.loja] = [];
                pedidosPorLoja[item.loja].push(item);
            });

            const cabecalhoEndereco = `👤 *Cliente:* ${clienteLogado.nome}\n📱 *WhatsApp:* ${clienteLogado.telefone}\n📍 *Praça:* ${nomesRegioes[clienteLogado.regiao]}\n📍 *Entrega:* ${rua}, Nº ${numero}\n🏘️ *Bairro:* ${bairro}\n📮 *CEP:* ${cep}\n💳 *Forma de Pagto:* ${pag}\n\n`;

            try {
                const promessasDeEnvio = Object.keys(pedidosPorLoja).map(async (nomeDaLoja) => {
                    const itensDestaLoja = pedidosPorLoja[nomeDaLoja];
                    let totalDestaLoja = 0;
                    
                    let resumoLoja = `🚨 *NOVA SOLICITAÇÃO DE DELIVERY - ${nomeDaLoja.toUpperCase()}* 🚨\n\n`;
                    resumoLoja += cabecalhoEndereco;
                    resumoLoja += `🛒 *PRODUTOS SOLICITADOS NA SUA UNIDADE:*\n`;

                    itensDestaLoja.forEach(produto => {
                        resumoLoja += `• ${produto.nome} - R$ ${produto.preco.toFixed(2)}\n`;
                        totalDestaLoja += produto.preco;
                    });
                    resumoLoja += `\n💰 *VALOR A RECEBER:* R$ ${totalDestaLoja.toFixed(2)}\n`;

                    let credenciais = franquiasTelegram[clienteLogado.regiao][nomeDaLoja];
                    if (!credenciais) credenciais = { botToken: "8671565303:AAHA8RQZTmrdejIR0lpW4wFqDOhmnX88k9k", chatId: "1703808186" };

                    const urlTelegram = `https://api.telegram.org/bot${credenciais.botToken}/sendMessage`;

                    return fetch(urlTelegram, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: credenciais.chatId, text: resumoLoja, parse_mode: "Markdown" })
                    });
                });

                await Promise.all(promessasDeEnvio);

                alert("✅ Pedidos enviados! Os atacadistas da sua região já receberam a ordem de entrega.");

                sacola = [];
                document.getElementById('cliente-cep').value = '';
                document.getElementById('cliente-rua').value = '';
                document.getElementById('cliente-numero').value = '';
                document.getElementById('cliente-bairro').value = '';
                document.getElementById('cliente-pagamento').value = '';
                
                atualizarInterfaceCarrinho();
                document.getElementById('painel-carrinho').classList.add('translate-x-full');

            } catch (error) {
                alert("❌ Ocorreu um erro na rede. Tente finalizar novamente.");
                btn.disabled = false;
                btn.innerHTML = '<i class="fab fa-telegram-plane text-xl"></i> Finalizar Pedidos';
            }
        }

        // ==============================================================
        // INTEGRAÇÃO CLOUDFLARE
        // ==============================================================
        async function ativarIA() {
            const query = document.getElementById('produto').value.trim();
            if (!query) return;
            
            document.getElementById('produto').blur();

            const feed = document.getElementById('feed-ofertas');
            const status = document.getElementById('status-container');
            const btn = document.getElementById('btn-buscar');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-1"></i> Buscando...';
            feed.innerHTML = '';
            status.classList.remove('hidden');
            status.innerHTML = `<div class="inline-flex items-center gap-3 text-cyan-400 font-mono text-xs md:text-sm"><i class="fas fa-radar fa-spin text-lg"></i> Varrendo mercados em ${nomesRegioes[clienteLogado.regiao]}...</div>`;

            try {
                const urlDoRobo = `https://mercado.gpartnerllc.workers.dev/?produto=${encodeURIComponent(query)}&regiao=${encodeURIComponent(clienteLogado.regiao)}`;
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 18000);

                const res = await fetch(urlDoRobo, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!res.ok) throw new Error(`Falha na API (Status HTTP: ${res.status})`);
                const data = await res.json();

                btn.disabled = false;
                btn.innerHTML = 'Buscar';
                status.classList.add('hidden');

                if (data.erro) throw new Error(data.erro);
                if (!Array.isArray(data) || data.length === 0) throw new Error('Sem estoque.');

                data.forEach((oferta, i) => {
                    const precoNum = parseFloat(oferta.preco) || 0;
                    if(oferta.loja === "⚠️ ALERTA") throw new Error(oferta.nome);
                    else desenharCard(oferta.loja, oferta.nome, precoNum, i === 0);
                });

            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = 'Buscar';
                let msg = err.message;
                if (err.name === 'AbortError') msg = "A busca demorou muito. Tente novamente.";
                status.innerHTML = `<div class="inline-block glass-panel border-red-500/30 bg-red-900/20 text-red-300 px-4 md:px-6 py-3 md:py-5 rounded-xl text-xs md:text-sm font-mono"><i class="fas fa-exclamation-triangle mr-2"></i> ${msg}</div>`;
            }
        }

        function desenharCard(loja, produto, preco, isMelhorPreco) {
            const feed = document.getElementById('feed-ofertas');
            const precoFormatado = formatarMoeda(preco);
            const nomeEsc = produto.replace(/'/g, "").replace(/"/g, "");
            const lojaEsc = loja.replace(/'/g, "").replace(/"/g, "");

            const botaoAcao = `<button onclick="adicionarAoCarrinho('${nomeEsc}', '${lojaEsc}', ${preco})" class="w-full text-center bg-cyan-600 hover:bg-cyan-500 text-white text-xs md:text-sm font-bold py-3 rounded-lg transition-colors uppercase tracking-wider shadow-[0_0_10px_rgba(8,145,178,0.4)] mt-2"><i class="fas fa-cart-plus mr-2"></i> Por na Sacola</button>`;
            
            const cardHTML = `
                <div class="glass-panel bg-[#0a0a0a]/80 p-5 md:p-6 rounded-2xl relative flex flex-col justify-between animate-slide-up ${isMelhorPreco ? 'border-cyan-500/50 shadow-[0_0_25px_rgba(8,145,178,0.2)] scale-[1.02]' : 'border-white/5'}">
                    ${isMelhorPreco ? `<div class="absolute -top-3 left-4 md:left-6 bg-cyan-500 text-black text-[9px] md:text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-md">Melhor Preço Local</div>` : ''}
                    <div>
                        <div class="flex justify-between items-center mb-3 mt-1 md:mt-2">
                            <span class="text-[10px] md:text-xs font-semibold text-gray-400 uppercase tracking-widest">${loja}</span>
                            <span class="text-green-400 text-[9px] md:text-[10px] bg-green-400/10 border border-green-400/20 px-2 py-0.5 rounded backdrop-blur-sm uppercase tracking-wider font-bold"><i class="fas fa-check mr-1"></i> Estoque</span>
                        </div>
                        <h3 class="text-sm md:text-lg font-medium text-white mb-4 line-clamp-3 leading-snug">${produto}</h3>
                    </div>
                    <div class="flex flex-col mt-auto border-t border-white/10 pt-3 md:pt-4 gap-2 md:gap-3">
                        <div class="flex flex-col">
                            <span class="text-[9px] md:text-[10px] text-gray-400 uppercase tracking-widest mb-1">Preço na Loja</span>
                            <span class="text-2xl md:text-3xl font-extrabold ${isMelhorPreco ? 'text-cyan-400' : 'text-white'} drop-shadow-md">${precoFormatado}</span>
                        </div>
                        ${botaoAcao}
                    </div>
                </div>`;
            feed.insertAdjacentHTML('beforeend', cardHTML);
        }

        // ESCUDO B2B
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.onkeydown = function(e) {
            if (e.keyCode === 123) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode === 'I'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode === 'J'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.shiftKey && e.keyCode === 'C'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode === 'U'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode === 'S'.charCodeAt(0)) return false;
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA | Comparador de Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#050505',
                        glassBg: 'rgba(20, 20, 20, 0.7)',
                    },
                    animation: {
                        'glow': 'glow 2s ease-in-out infinite alternate',
                        'slide-up': 'slideUp 0.5s ease-out forwards'
                    },
                    keyframes: {
                        glow: {
                            '0%': { boxShadow: '0 0 10px #0891b2, 0 0 20px #0891b2' },
                            '100%': { boxShadow: '0 0 20px #06b6d4, 0 0 30px #06b6d4' }
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #ededed; font-family: 'Inter', sans-serif; }
        /* Efeito de vidro inspirado na Accio */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        /* Fundo com grid sutil */
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-darkBg min-h-screen bg-grid relative overflow-x-hidden flex flex-col items-center pt-16">

    <div class="absolute top-[-10%] left-[20%] w-[600px] h-[600px] bg-cyan-900/30 rounded-full blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-6xl px-6 relative z-10">
        
        <header class="text-center mb-16">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full glass-panel text-xs text-cyan-400 font-mono mb-6 uppercase tracking-widest border-cyan-500/30">
                <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Ofertas dos Atacados
            </div>
            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-4 bg-gradient-to-r from-white via-gray-200 to-gray-500 bg-clip-text text-transparent">
                </h1>
            <p class="text-gray-400 text-lg md:text-xl max-w-2xl mx-auto font-light">
                Comparação de preços. Insira o nome produto.
            </p>
        </header>

        <div class="glass-panel p-2 rounded-2xl flex items-center shadow-2xl max-w-3xl mx-auto mb-16 relative hover:border-cyan-500/50 transition-colors duration-300">
            <i class="fas fa-search text-gray-500 ml-4 text-xl"></i>
            <input type="text" id="produto" placeholder="Qual produto deseja auditar? Ex: Arroz 5kg Camil" 
                   class="w-full bg-transparent border-none outline-none text-white px-4 py-4 text-lg placeholder-gray-600">
            <button onclick="ativarIA()" id="btn-buscar" 
                    class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-8 rounded-xl transition-all duration-300 shadow-[0_0_15px_rgba(8,145,178,0.5)]">
                Auditar
            </button>
        </div>

        <div id="status-container" class="text-center mb-8 hidden">
            </div>

        <div id="feed-ofertas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-20">
            </div>

    </div>

    <script>
        async function ativarIA() {
            const produtoInput = document.getElementById('produto').value.trim();
            const feed = document.getElementById('feed-ofertas');
            const statusContainer = document.getElementById('status-container');
            const btnBuscar = document.getElementById('btn-buscar');
            
            if(!produtoInput) return;

            // Estado de Loading Premium
            btnBuscar.disabled = true;
            btnBuscar.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
            feed.innerHTML = '';
            statusContainer.classList.remove('hidden');
            
            // Texto ajustado para informar que a busca de 4 lojas demora um pouco
            statusContainer.innerHTML = `
                <div class="inline-flex items-center gap-3 text-cyan-400 font-mono text-sm">
                    <i class="fas fa-radar fa-spin text-xl"></i> Vasculhando atacadistas (pode levar até 15 segundos)...
                </div>
            `;
            
            try {
                // Aumentando o timeout da requisição no Frontend para não quebrar a busca paralela
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000); // 30 segundos de tolerância máxima

                const urlDoRobo = `https://ia-sellers.gpartnerllc.workers.dev/?produto=${encodeURIComponent(produtoInput)}`;
                
                const resposta = await fetch(urlDoRobo, { signal: controller.signal });
                clearTimeout(timeoutId);
                
                const dados = await resposta.json();
                
                // Restaura o botão
                btnBuscar.disabled = false;
                btnBuscar.innerHTML = 'Auditar';
                statusContainer.classList.add('hidden');
                
                if (dados.erro) throw new Error(dados.erro);

                // Se o Worker retornar a Lista, desenha os cards (MANTIDO INTACTO)
                if (Array.isArray(dados) && dados.length > 0) {
                    dados.forEach((oferta, index) => {
                        const isMelhorPreco = index === 0; // O primeiro da lista é o mais barato
                        desenharCard(oferta.loja, oferta.nome, oferta.preco, oferta.link, isMelhorPreco, index);
                    });
                } else {
                    throw new Error("Nenhuma oferta localizada nas lojas consultadas no momento.");
                }
                
            } catch (erro) {
                btnBuscar.disabled = false;
                btnBuscar.innerHTML = 'Auditar';
                statusContainer.classList.remove('hidden');
                
                // Melhoria visual para erro de Timeout
                const mensagemErro = erro.name === 'AbortError' 
                    ? "A rede demorou muito a responder. Tente pesquisar novamente." 
                    : erro.message;

                statusContainer.innerHTML = `
                    <div class="inline-block glass-panel border-red-500/30 text-red-400 px-6 py-4 rounded-xl text-sm font-mono">
                        <i class="fas fa-exclamation-triangle mr-2"></i> ${mensagemErro}
                    </div>
                `;
            }
        }

        // FUNÇÃO DE DESENHAR O CARD (MANTIDA INTACTA COM O SEU DESIGN)
        function desenharCard(loja, produto, preco, link, isMelhorPreco, index) {
            const feed = document.getElementById('feed-ofertas');
            const delay = index * 100; // Efeito cascata na animação

            // Formatação segura do preço
            let precoVisual = preco;
            if (typeof preco === 'number') {
                precoVisual = preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
            } else if (!preco.toString().includes('R$')) {
                precoVisual = `R$ ${preco}`;
            }
            
            const cardHTML = `
                <div class="glass-panel p-6 rounded-2xl relative flex flex-col justify-between hover:-translate-y-2 transition-transform duration-300 animate-slide-up ${isMelhorPreco ? 'border-cyan-500/50 shadow-[0_0_30px_rgba(8,145,178,0.15)] scale-[1.02]' : ''}" style="animation-delay: ${delay}ms;">
                    
                    ${isMelhorPreco ? `
                    <div class="absolute -top-3 left-6 bg-cyan-500 text-black text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-[0_0_10px_rgba(6,182,212,0.8)]">
                        <i class="fas fa-trophy mr-1"></i> Melhor Preço
                    </div>` : ''}

                    <div>
                        <div class="flex justify-between items-start mb-4 mt-2">
                            <span class="text-xs font-semibold text-gray-400 uppercase tracking-widest">${loja}</span>
                            <span class="text-green-400 text-xs bg-green-400/10 px-2 py-1 rounded"><i class="fas fa-check"></i> Auditado</span>
                        </div>
                        <h3 class="text-lg font-medium text-white leading-tight mb-6 line-clamp-3">${produto}</h3>
                    </div>
                    
                    <div class="flex items-end justify-between mt-auto border-t border-white/5 pt-4">
                        <div class="flex flex-col">
                            <span class="text-[10px] text-gray-500 uppercase tracking-widest mb-1">Preço Atual</span>
                            <span class="text-3xl font-bold ${isMelhorPreco ? 'text-cyan-400' : 'text-white'} tracking-tighter">${precoVisual}</span>
                        </div>
                        <a href="${link}" target="_blank" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-white hover:bg-cyan-500 transition-colors">
                            <i class="fas fa-arrow-right -rotate-45"></i>
                        </a>
                    </div>
                </div>
            `;
            
            feed.insertAdjacentHTML('beforeend', cardHTML);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA SELLERS - Ofertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen">
    <div class="container mx-auto p-6 max-w-6xl">
        
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 border-b border-slate-700 pb-5">
            <h1 class="text-3xl font-bold text-cyan-400 tracking-tight">
                <i class="fas fa-robot mr-3"></i>Buscador Inteligente IA
            </h1>
            <div class="mt-4 md:mt-0 flex items-center space-x-4">
                <span class="text-slate-400 text-sm font-mono">Projeto SandxCDD</span>
                <div id="status" class="bg-green-500/20 text-green-400 border border-green-500 text-xs px-3 py-1 rounded-full animate-pulse font-bold tracking-widest">
                    ● LIVE: MONITORANDO 9 GIGANTES DO ATACADO
                </div>
            </div>
        </header>

        <section class="bg-slate-800 p-6 md:p-8 rounded-2xl shadow-2xl mb-10 border border-slate-700 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-64 h-64 bg-cyan-600 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob"></div>
            
            <h2 class="text-xl mb-6 text-cyan-200 font-semibold flex items-center">
                <i class="fas fa-crosshairs mr-2"></i> Cadastrar Alvo de Busca
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-12 gap-4 relative z-10">
                <div class="md:col-span-5">
                    <input type="text" id="produto" placeholder="O que deseja buscar? (Ex: Arroz 5kg, Óleo de Soja)" 
                           class="w-full bg-slate-900/50 p-4 rounded-xl border border-slate-600 text-white placeholder-slate-400 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
                </div>
                <div class="md:col-span-3">
                    <input type="number" id="preco_alvo" placeholder="Preço Alvo (R$)" 
                           class="w-full bg-slate-900/50 p-4 rounded-xl border border-slate-600 text-white placeholder-slate-400 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 transition-all">
                </div>
                <div class="md:col-span-4">
                    <button onclick="ativarIA()" id="btn-buscar" 
                            class="w-full h-full bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 transition-all p-4 rounded-xl font-bold uppercase tracking-wider shadow-[0_0_20px_rgba(8,145,178,0.4)] hover:shadow-[0_0_30px_rgba(8,145,178,0.6)] flex justify-center items-center">
                        <i class="fas fa-bolt mr-2 text-yellow-300"></i> Ativar Varredura IA
                    </button>
                </div>
            </div>
        </section>

        <div class="flex justify-between items-end mb-6">
            <h2 class="text-2xl font-semibold"><i class="fas fa-stream text-cyan-400 mr-2"></i>Fluxo de Entregas (Tempo Real)</h2>
            <span class="text-xs text-slate-500 uppercase tracking-widest">Validação Sem Filtros</span>
        </div>
        
        <div id="feed-ofertas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </div>

    <script>
        async function ativarIA() {
            const produtoInput = document.getElementById('produto').value.trim();
            const feed = document.getElementById('feed-ofertas');
            const btnBuscar = document.getElementById('btn-buscar');
            
            // 1. Trava de Segurança: Não busca vazio
            if(!produtoInput) {
                alert("Por favor, digite o nome de um produto para a IA procurar.");
                document.getElementById('produto').focus();
                return;
            }

            // 2. Feedback Visual de Processamento (Efeito SandxCDD de busca profunda)
            btnBuscar.disabled = true;
            btnBuscar.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Processando...';
            btnBuscar.classList.add('opacity-75', 'cursor-not-allowed');

            feed.innerHTML = `
                <div class="col-span-1 md:col-span-2 lg:col-span-3 text-center py-16 bg-slate-800 rounded-2xl border border-cyan-900/50 shadow-inner relative overflow-hidden">
                    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-5"></div>
                    <div class="relative z-10">
                        <i class="fas fa-radar fa-spin text-5xl text-cyan-400 mb-4 drop-shadow-[0_0_10px_rgba(34,211,238,0.8)]"></i>
                        <p class="text-cyan-300 font-bold text-xl uppercase tracking-widest">Iniciando Infiltração nos Atacadistas</p>
                        <p class="text-slate-400 text-sm mt-3 font-mono">Contornando WAFs | Analisando HTML/JSON Ocultos | Extraindo via Gemini V8</p>
                    </div>
                </div>
            `;
            
            try {
                // 3. Conexão com o seu Cloudflare Worker (O Cérebro)
                const urlDoRobo = `https://ia-sellers.gpartnerllc.workers.dev/?produto=${encodeURIComponent(produtoInput)}`;
                
                const resposta = await fetch(urlDoRobo);
                const dados = await resposta.json();
                
                // 4. Limpa a tela de loading
                feed.innerHTML = "";
                btnBuscar.disabled = false;
                btnBuscar.innerHTML = '<i class="fas fa-bolt mr-2 text-yellow-300"></i> Ativar Varredura IA';
                btnBuscar.classList.remove('opacity-75', 'cursor-not-allowed');
                
                // 5. Tratamento de Erro Inteligente (WAF Bloqueado, Chave Inválida, etc)
                if (dados.erro) {
                    feed.innerHTML = `
                        <div class="col-span-1 md:col-span-2 lg:col-span-3 p-8 bg-orange-950/40 border-l-4 border-orange-500 rounded-xl shadow-lg relative overflow-hidden">
                            <div class="flex items-start">
                                <i class="fas fa-shield-alt text-4xl text-orange-400 mr-4"></i>
                                <div>
                                    <h3 class="font-bold text-xl text-orange-300 mb-2">Relatório de Bloqueio da IA</h3>
                                    <p class="text-slate-300 font-mono text-sm leading-relaxed">${dados.erro}</p>
                                    <p class="text-xs text-slate-500 mt-4">Ação recomendada: Tente pesquisar novamente em 5 segundos. O algoritmo tentará uma nova rota.</p>
                                </div>
                            </div>
                        </div>
                    `;
                    return;
                }

                // 6. Sucesso! Desenha a Oferta na Tela
                adicionarOferta(
                    dados.loja || "Origem Desconhecida", 
                    dados.nome || produtoInput, 
                    dados.preco || "Preço não extraído", 
                    dados.link || "#"
                );
                
            } catch (erro) {
                // 7. Falha Crítica (Internet caiu ou Cloudflare fora do ar)
                feed.innerHTML = "";
                btnBuscar.disabled = false;
                btnBuscar.innerHTML = '<i class="fas fa-bolt mr-2 text-yellow-300"></i> Ativar Varredura IA';
                btnBuscar.classList.remove('opacity-75', 'cursor-not-allowed');

                feed.innerHTML = `
                    <div class="col-span-1 md:col-span-2 lg:col-span-3 bg-red-950/30 p-8 border border-red-800 rounded-2xl text-center">
                        <i class="fas fa-network-wired text-4xl text-red-500 mb-4"></i>
                        <p class="text-red-400 font-bold text-xl uppercase tracking-wider">Falha de Conexão Mestre</p>
                        <p class="text-slate-400 mt-2 text-sm">Não foi possível alcançar o servidor da IA no Cloudflare.</p>
                        <p class="text-slate-600 mt-2 text-xs font-mono bg-black/20 p-2 rounded inline-block">${erro.message}</p>
                    </div>
                `;
            }
        }

        // Função de Design do Card de Entrega (KPI)
        function adicionarOferta(loja, produto, preco, link) {
            const feed = document.getElementById('feed-ofertas');
            
            // Garantir que o preço exiba bem, mesmo se a IA trouxer um texto sujo
            const precoFormatado = preco.toString().replace('R$', '').trim();
            
            const card = `
                <div class="bg-slate-800 p-6 rounded-2xl border-t-4 border-cyan-500 shadow-[0_8px_30px_rgba(0,0,0,0.4)] hover:-translate-y-2 transition-transform duration-300 relative group">
                    
                    <div class="absolute -top-3 right-4 bg-slate-900 border border-slate-700 text-slate-400 text-[10px] px-2 py-1 rounded-full uppercase tracking-wider group-hover:border-cyan-500 group-hover:text-cyan-400 transition-colors">
                        <i class="fas fa-check-double mr-1 text-green-500"></i> IA Validada
                    </div>

                    <div class="flex justify-between items-start mt-2">
                        <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider max-w-[60%] truncate" title="${loja}">${loja}</span>
                    </div>
                    
                    <h3 class="text-lg mt-4 font-medium text-white leading-snug line-clamp-2 h-14" title="${produto}">${produto}</h3>
                    
                    <div class="mt-6 flex items-end justify-between border-t border-slate-700 pt-4">
                        <div>
                            <span class="text-xs text-slate-500 uppercase tracking-widest block mb-1">Melhor Preço</span>
                            <span class="text-green-400 font-black text-2xl tracking-tighter">R$ ${precoFormatado}</span>
                        </div>
                        <a href="${link}" target="_blank" class="bg-slate-700 hover:bg-cyan-600 text-white px-4 py-2 rounded-lg text-sm font-bold transition-colors shadow-md flex items-center">
                            Ver <i class="fas fa-external-link-alt ml-2 text-xs"></i>
                        </a>
                    </div>
                </div>
            `;
            
            // Coloca sempre a oferta mais recente no topo do feed
            feed.insertAdjacentHTML('afterbegin', card);
        }
    </script>
</body>
</html>
